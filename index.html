<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Eye Alarm</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #bbb;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: white;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    video {
      width: 400px;
      max-width: 95%;
      margin: 25px auto;
      display: block;
      border-radius: 15px;
      background: #222;
    }
  </style>
</head>

<body>

  <h1>👁️ Study Eye Alarm</h1>

  <p>AI-powered study drowsiness detector</p>

  <button id="startBtn">Start Study</button>

  <p id="status">Status: Not Started</p>

  <script src="script.js"></script>

</body>
</html>
