<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Study Eye Alarm</title>

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
    }

    h1 {
      margin-bottom: 5px;
    }

    p {
      color: #aaa;
    }

    .camera-box {
      width: 640px;
      max-width: 95%;
      margin: 25px auto;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 15px;
      transform: scaleX(-1);
      background: #222;
    }

    button {
      padding: 13px 25px;
      border: none;
      border-radius: 8px;
      background: white;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .status {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .eye-status {
      margin-top: 10px;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <h1>👁️ Study Eye Alarm</h1>

  <p>AI-powered study drowsiness detector</p>

  <button id="startBtn">Start Study</button>

  <div class="camera-box">
    <video id="video" autoplay playsinline></video>
  </div>

  <div class="status" id="status">
    Status: Not Started
  </div>

  <div class="eye-status" id="eyeStatus">
    Eyes: —
  </div>

  <script type="module" src="script.js"></script>

</body>
</html>
